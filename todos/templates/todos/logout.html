{% extends "../base.html" %} {% load static %} {% block css %}
<style>
  input,
  textarea {
    text-transform: capitalize;
  }
  .container-wrapper {
    box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.24);
    border-radius: 20px;
  }
  body {
    overflow: hidden;
  }
  #id_title_error > li {
    list-style-type: none;
    color: red;
  }
  #id_title_error {
    padding-left: 0;
  }
</style>
{% endblock %} {% block body %}
<div class="container-fluid text-black text-capitalize px-0">
  {% include "./navbar.html" with title="logout" user=user %}
  <div class="form-wrapper d-flex align-items-center justify-content-center">
    <div class="container-wrapper mx-4 py-3 w-100">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-5 d-none d-md-block">
            <div class="todo-image">
              <img
                src="{% static 'todos/images/logout.png'%}"
                class="w-75"
                alt="todo_image_logo"
              />
            </div>
          </div>
          <div class="col-12 col-md-7">
            <form method="post" class="todo_form w-100 text-capitalize p-3">
              <h3 class="text-center">Are you sure you want to log out?</h3>
              <input
                class="btn btn-primary w-100"
                type="submit"
                value="confirm"
              />
              {% csrf_token %}
              <a
                class="btn btn-danger my-2 w-100"
                href="{% url 'todo_list:index' %}"
                >Cancel</a
              >
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
